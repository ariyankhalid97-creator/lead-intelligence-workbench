name: Feature request
description: Propose a focused improvement to the workflow or interface.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user outcome is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
      description: Describe the smallest useful change and where it belongs in the existing workflow.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Link public documentation or explain alternative approaches considered.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project boundaries
      options:
        - label: This request does not require bypassing authentication, CAPTCHAs, paywalls, robots rules or access controls.
          required: true
        - label: This request keeps email sending and other external actions approval-gated.
          required: true
